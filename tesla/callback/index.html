<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Tesla authorization</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3em auto;padding:0 1em}code{display:block;word-break:break-all;background:#f3f3f3;padding:1em;border-radius:6px}</style></head>
<body><h1>Tesla authorization</h1><div id="out">Reading response…</div>
<script>
(function(){var p=new URLSearchParams(location.search),o=document.getElementById('out');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
if(p.get('error')){o.innerHTML='<p><b>Error:</b> '+esc(p.get('error'))+'</p><p>'+esc(p.get('error_description')||'')+'</p>';return;}
var c=p.get('code');if(!c){o.textContent='No code in this URL.';return;}
o.innerHTML='<p>Copy this code (it expires in a few minutes):</p><code>'+esc(c)+'</code>'+(p.get('state')?'<p>state: '+esc(p.get('state'))+'</p>':'')+(p.get('issuer')?'<p>issuer: '+esc(p.get('issuer'))+'</p>':'');})();
</script></body></html>
